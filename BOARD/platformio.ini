[env:lolin_s3_mini]
; Pin versions so every computer produces the same firmware.
platform = espressif32@6.12.0
board = lolin_s3_mini
framework = arduino
; The default partition limits the application to 1.25 MiB. Wi-Fi, TLS,
; NimBLE, display and JSON together need more space on this 4 MB board.
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit SSD1306@2.5.17
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@7.4.3
  h2zero/NimBLE-Arduino@2.5.2
